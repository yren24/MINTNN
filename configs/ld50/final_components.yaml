application: ld50
targets:
  - LD50
data_dir: data/ld50
feature_dir: data/ld50/topology_features
invariants:
  PH:
    path: data/ld50/topology_features/PH
    topology_key: homology
  PL:
    path: data/ld50/topology_features/PL
    topology_key: lap
  CA:
    path: data/ld50/topology_features/CA
    topology_key: facet
  EIC:
    path: data/ld50/topology_features/EIC
    topology_key: curvature
    encodings:
      single_direction:
        path: data/ld50/topology_features/EIC/single_direction
        used_by:
          - CNN
          - SNN
      bidirectional:
        path: data/ld50/topology_features/EIC/bidirectional
        used_by:
          - ANN
          - CTNN
  FPRC:
    path: data/ld50/topology_features/FPRC
    topology_key: forman
architectures:
  ANN: applications/ld50/ann.py
  CNN: applications/ld50/cnn.py
  SNN: applications/ld50/snn.py
  CTNN: applications/ld50/ctnn.py
notes:
  - EIC has two released encodings. The dispatcher selects the final encoding from the architecture.
  - Component-level hyperparameter sweeps and retained model summaries are documented in metadata/.
