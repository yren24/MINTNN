[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mintnn"
version = "0.1.0"
description = "Mathematical Invariant-Enabled Topological Neural Networks"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy==1.26.4",
    "scipy>=1.10",
    "scikit-learn==1.3.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "torch==2.4.1",
]

[project.optional-dependencies]
snn = [
    "torch-geometric>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
